logging:
  directory: files
  filename: events.log

authentication:
  auth_details:
    directory: files
    filename: auth_details.csv

inventory:
  directory: files
  filename: inventory.csv
  max_medicine_quantity: 100 #max units of a single medicine in one cabinet
  max_cabinet_quantity: 100 #max units of all medicines combined in one cabinet

external_communication:
  poll_interval: 0.05 #seconds between checks of the serial driver for new messages

serial:
  port: COM5
  baudrate: 115200
  bytesize: 8 
  parity: "N" 
  stopbits: 1 
  timeout: 0.1 #read timeout in seconds
  write_timeout: 1.0 #write timeout in seconds
  xonxoff: false 
  rtscts: false 
  dsrdtr: false 
  line_ending: "\n" #message terminator
  rx_queue_size: 100 #max number of complete received messages buffered
